<style id="reading-edition">
.row>.notes,.mono .row>.notes{align-self:start;min-width:0;height:auto;max-height:none;background:#edf3ec;border:0;border-left:3px solid #77947f;border-radius:0 5px 5px 0;padding:.18rem .65rem;color:#28443b;font:400 clamp(14px,1.03vw,16px)/1.56 "Microsoft YaHei",system-ui,sans-serif}
.row>.notes>.brief{margin:0;padding:0;font:inherit;letter-spacing:normal}
.row .loc{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .75rem}
.row .loc .note-toggle{margin-left:auto;font:500 13px/1.4 "Microsoft YaHei",sans-serif;border:1px solid #c4d2c6;background:transparent;color:#355c4d;border-radius:4px;padding:.1rem .48rem}
.note-toggle[aria-expanded="true"]{text-decoration:underline}.deep-panel[hidden]{display:none!important}
.deep-panel{margin-top:.65rem;border-top:1px solid #c3d3c6;padding-top:.55rem}.deep-panel p{line-height:1.6}
.publication-pages{padding:.7rem 0;margin:1rem 0;border-block:1px solid #d1d9cf}.publication-pages a{display:inline-block;margin:.25rem .7rem .25rem 0}
.row-alias{width:0;height:0}
.fit-columns .row,.fit-columns .column-head,.mono .fit-columns .row,.mono .fit-columns .column-head{grid-template-columns:var(--fit-cols)}
.row>.notes .note-preview{margin:.4rem 0 0;border-top:1px solid #cbdbce;padding:.35rem 0 0;line-height:1.55;color:#405b4e}
.note-preview[hidden],.notes:has(.deep-panel:not([hidden])) .note-preview{display:none}
@media(min-width:801px){.mono .row,.mono .column-head{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}}
@media(max-width:760px){.row>.notes,.mono .row>.notes{margin-top:.35rem;padding:.45rem .7rem}.notes .brief:before{content:"本段小结";display:block;color:#536e60;font:600 .76rem/1.5 "Microsoft YaHei",sans-serif}}
@media print{.deep-panel[hidden]{display:block!important}.note-toggle{display:none}}
.mono .row,.mono .column-head{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
mark.data,.legend i.data{background:#f6dcb4}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const head=document.querySelector('.column-head'),main=head?.closest('main');
  const rows=Array.from(document.querySelectorAll('article.row'),row=>({
    source:[...row.querySelectorAll(':scope>.en,:scope>.zh')],notes:row.querySelector(':scope>aside'),
    preview:row.querySelector('.note-preview'),panel:row.querySelector('.deep-panel')
  }));
  let previous=0,frame=0;
  function fit(){
    if(!main)return;
    const width=Math.round(head.getBoundingClientRect().width);
    if(width===previous)return;
    previous=width;
    for(const row of rows)if(row.preview)row.preview.hidden=true;
    main.classList.remove('fit-columns');
    if(!width||getComputedStyle(head).display==='none')return;
    const cols=[...head.children].map(c=>c.getBoundingClientRect().width);
    const total=cols.reduce((a,b)=>a+b,0),side=cols.pop();
    const ratio=cols.map(w=>w/(total-side));
    const closed=rows.filter(r=>!r.panel||r.panel.hidden);
    function excess(r){
      return r.notes.getBoundingClientRect().height-Math.max(...r.source.map(c=>c.getBoundingClientRect().height));
    }
    for(let share=side/total;share<.46&&closed.some(r=>excess(r)>24);){
      share=Math.min(.46,share+.034);
      const widths=[...ratio.map(p=>p*(1-share)),share];
      main.style.setProperty('--fit-cols',widths.map(w=>'minmax(0,'+w+'fr)').join(' '));
      main.classList.add('fit-columns');
    }
    // Only show a complete additional point if it fits alongside the source text.
    const candidates=closed.filter(r=>r.preview&&excess(r)<-50);
    for(const row of candidates)row.preview.hidden=false;
    const tooTall=candidates.filter(r=>excess(r)>1);
    for(const row of tooTall)row.preview.hidden=true;
  }
  function schedule(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>requestAnimationFrame(fit))}
  window.addEventListener('resize',schedule,{passive:true});
  window.addEventListener('load',()=>{previous=-1;schedule()},{once:true});
  document.fonts?.ready.then(()=>{previous=-1;schedule()});
  schedule();
  function setPanel(button,open){
    const panel=document.getElementById(button.getAttribute('aria-controls'));
    if(!panel)return;
    panel.hidden=!open;
    button.setAttribute('aria-expanded',String(open));
    button.textContent=open?'收起解读':'展开解读';
  }
  document.addEventListener('click',e=>{
    const button=e.target.closest('.note-toggle');
    if(button){setPanel(button,button.getAttribute('aria-expanded')==='false');return}
    const jump=e.target.closest('#revision-jump a');
    if(jump&&['进一步研究','对照证据'].includes(jump.textContent.trim())){
      const target=document.getElementById(jump.hash.slice(1));
      const toggle=target?.closest('.row')?.querySelector('.note-toggle');
      if(toggle)setPanel(toggle,true);
    }
  });
});
</script>
